apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual
  namespace: actual
spec:
  parentRefs:
    - name: shared-gw
      namespace: gateway-system
      sectionName: https   # wildcard cert *.dev.snteks.com covers this hostname
  hostnames:
    - budget.dev.snteks.com
  rules:
    - backendRefs:
        - name: actual
          port: 5006
