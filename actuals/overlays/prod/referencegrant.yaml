apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: actual-tls-grant
  # ReferenceGrant lives in the namespace that OWNS the secret (actual),
  # granting the Gateway in gateway-system permission to reference it.
  namespace: actual
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
      name: actual-tls
