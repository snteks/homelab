# Smoke-test HTTPRoute — validates the shared Gateway is working.
# Deploy a simple backend (e.g. nginx) in the smoke-test namespace first.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke-test
  labels:
    gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke
  namespace: smoke-test
spec:
  parentRefs:
    - name: shared-gw
      namespace: gateway-system
  hostnames:
    - smoke.dev.snteks.com
  rules:
    - backendRefs:
        - name: smoke-web
          port: 80
