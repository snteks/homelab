apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-system-default-deny
  namespace: gateway-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
