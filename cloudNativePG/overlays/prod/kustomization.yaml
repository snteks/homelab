# File: overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnpg-system

resources:
  - ../../base

commonLabels:
  environment: prod

configMapGenerator:
  - name: cnpg-helm-values
    files:
      - values.yaml

helmCharts:
  - name: cloudnative-pg
    valuesFile: values.yaml
