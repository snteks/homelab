# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 8.5.8 # Use desired version
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml # Optional custom values
